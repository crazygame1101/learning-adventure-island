e:13px}input[type=checkbox]{accent-color:#4b66b5}.checkline{display:flex;gap:9px;align-items:flex-start;margin:12px 0;font-weight:600}.checkline input{margin-top:6px}.reviewrow{background:#f5f8fc;padding:13px;border-radius:13px;margin:11px 0}.labelnote{font-size:12px;color:#69768b;margin-top:6px}@media(max-width:740px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}.side .panel{padding:13px}.side .pet{font-size:45px;padding:0}.side .petname{font-size:15px}.side-inner{display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:center}.grid{grid-template-columns:1fr}.result-grid{grid-template-columns:1fr 1fr}.actions{flex-direction:column}.petbubble{display:none}}@media print{body{background:white;color:#111}header,.side,.actions,.stepbar,.footer,.teacher,.no-print{display:none!important}main{max-width:100%;padding:0}.layout{display:block}.panel{box-shadow:none;border:0;padding:0}.printonly{display:block}#app>div:not(.layout){display:none}}

</style></head><body><main><header class="top"><div class="brand"><span class="brandicon">🌱</span><div><strong>學習冒險島</strong><div class="sub">自律養成實驗室 · 學一點，進步一點</div></div></div><div class="top-actions"><button class="btn small outline" id="teacherBtn">👩‍🏫 教師提示：關</button><button class="btn small secondary" id="helpBtn">玩法說明</button></div><div id="headerProgress" class="headerprogress" aria-live="polite"></div></header><div id="app"></div><p class="footer">教育心理學課堂教具原型｜依 Bandura 自我觀察、自我評價與自我反應（含自我增強）概念設計。XP、徽章與寵物等級只是遊戲機制，不代表測量到心理能力提升。紀錄只存在目前瀏覽器，不會自動送給老師。勿輸入姓名、學號等個資。</p></main><div id="toast" class="toast hidden"></div>
<div id="finishDialog" class="dialogoverlay hidden" role="dialog" aria-modal="true" aria-labelledby="finishDialogHeading"><div class="dialogbox"><h2 id="finishDialogHeading"></h2><p id="finishDialogCopy"></p><div class="actions" id="finishDialogActions"></div></div></div>
<script>
'use strict';
const DATA=[
{id:'start',emoji:'🚀',name:'啟動力',state:'我總是拖延，不知道怎麼開始',focus:'先完成最小的一步',tasks:[['先做兩題','挑一科，先試做兩道題目；不會的地方可以標記。',['打開習作並找出兩題','先寫下第一題的已知條件','試著解答並圈出不會的地方']],['單字三連發','挑三個英文單字，念出來並試著造句。',['選出三個單字','唸出單字','各寫一句簡短例句']],['先寫第一行','將一份作業縮小到先完成第一個步驟。',['挑一份最想逃避的作業','確認題目要求','寫下第一行或第一個步驟']]]},
{id:'focus',emoji:'🎯',name:'專注力',state:'我常常分心、忍不住滑手機',focus:'減少干擾並觀察注意力',tasks:[['先專心一段時間','把手機移開，選一項學習內容專心進行。',['選出唯一要做的事情','移走手機或關通知','專注完成一小段']],['分心偵探','記錄分心的時刻，再練習把注意力帶回來。',['準備一張小紙條','分心時畫一筆，不責備自己','把注意力帶回當前任務']],['清爽書桌','清掉桌上干擾物後開始閱讀。',['收起不需要的物品','留下教材與文具','開始閱讀一小段內容']]]},
{id:'read',emoji:'📖',name:'理解力',state:'我讀了很多，卻抓不到重點',focus:'用自己的話理解與整理',tasks:[['一句話偵探','閱讀一篇短文，畫出最有感的一句並寫下原因。',['閱讀一小段文章','畫出一句關鍵句','寫下為什麼挑它']],['三個關鍵字','找出三個關鍵字，並試著解釋其中一個。',['讀完一小節','圈出三個關鍵字','用自己的話解釋一個']],['我是小老師','向自己或同學簡單解釋剛學到的內容。',['挑選一個概念','用一句話說明','舉出一個例子']]]},
{id:'solve',emoji:'🧩',name:'解題力',state:'我一遇到不會的題目就想放棄',focus:'辨認卡住的地方並找方法',tasks:[['卡點救援','找一道難題，把已知條件與卡住的地方寫下。',['讀懂題目問什麼','列出已知條件','寫下卡住的步驟']],['錯題偵探','回顧一題錯題，找出可能出錯的步驟。',['找出一題錯題','對照解法','圈出不同的那一步']],['換個解法','試著畫圖或看例題，再重試一題。',['確認原本怎麼做','試著畫圖或查例題','重試其中一步']]]},
{id:'memory',emoji:'🔁',name:'記憶力',state:'我讀過卻很快忘記',focus:'用主動回想確認自己記住什麼',tasks:[['遮住再回想','讀完小段內容後遮住課本，寫出記得的重點。',['閱讀短短一段','合上或遮住課本','試著寫下三個重點']],['自己出三題','依今天讀的內容出三題並嘗試回答。',['挑一段內容','設計三個問題','不看課本先回答']],['昨天的我','重做一題昨天不熟的題目。',['選一題昨天不會的','先獨立試做','對比昨天與今天的想法']]]},
{id:'growth',emoji:'🌱',name:'成長力',state:'我覺得自己一直沒有進步',focus:'辨認努力、結果與下一步',tasks:[['今天的小成功','寫下一件已完成的小事，以及自己怎麼做到。',['想一件今天做過的事','寫下具體行動','記錄自己用了什麼方法']],['失敗有線索','回想一次卡關，找出一項下次能調整的策略。',['寫下卡住的情況','辨認造成困難的原因','選出下次想試的做法']],['明天的一小步','幫明天設一個能真的開始的小目標。',['選一個想改善的情境','把目標縮小','決定何時開始']]]}
];
const REWARDS=[{name:'放鬆休息券',emoji:'🫧',text:'選擇一段舒服的休息時間，讓自己恢復精神。',tip:'可以喝水、伸展、閉眼休息。'},{name:'喜歡的飲品券',emoji:'🧋',text:'有條件時，可以選擇一杯自己喜歡的飲品犒賞自己。',tip:'不必花錢，也可以改成家中現有的飲品。'},{name:'音樂時光券',emoji:'🎵',text:'安排一首喜歡的歌曲，享受短暫的音樂時光。',tip:'留意不要讓休息無限延長。'},{name:'興趣時間券',emoji:'🎨',text:'安排一段喜歡的興趣活動，例如畫畫、閱讀或玩遊戲。',tip:'建議由自己決定合適的時長。'},{name:'成就肯定券',emoji:'⭐',text:'對自己說一句具體的肯定，並寫下今天值得肯定的行動。',tip:'這張不需要任何消費。'},{name:'自由選擇券',emoji:'🎁',text:'自行設計一項安全、可負擔、容易實現的獎勵。',tip:'休息也可以是一種獎勵。'}];
const STORE='learning-island-bandura-v6';
const initial=()=>({phase:'welcome',teacher:false,round:0,state:null,finishPromptCount:0,skill:null,task:0,minutes:5,custom:'',steps:[false,false,false],timerRemaining:300,wasStarted:false,logs:[],xp:0,petFood:0,petFeeds:0,selectedReward:null,final1:'',final2:'',rewardChoice:'',completionDate:null});
let s=initial();try{const raw=JSON.parse(localStorage.getItem(STORE)||'null');if(raw&&Array.isArray(raw.logs)&&raw.phase)s={...initial(),...raw};}catch(e){}
let ticker=null;const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const skill=()=>DATA.find(a=>a.id===s.skill)||DATA[0],task=()=>skill().tasks[s.task]||skill().tasks[0];const lvl=()=>Math.floor(s.xp/100)+1;const petLvl=()=>Math.floor(s.petFeeds/3)+1;const petEmoji=()=>['🥚','🐣','🐥','🦉'][Math.min(3,petLvl()-1)];const levelName=()=>['初學探險家','習慣練習生','自律行動家','成長引路人','學習守護者'][Math.min(4,lvl()-1)];const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(s))}catch(e){}};const b=(label,action,cl='')=>`<button class="btn ${cl}" data-action="${action}">${label}</button>`;const toast=m=>{const e=document.getElementById('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)};
function side(){return `<aside class="side"><div class="panel"><div class="side-inner"><div><div class="pet" aria-label="陪伴寵物">${petEmoji()}</div><div class="petname">小樹的夥伴</div></div><div><div class="levelname">🌟 Lv.${lvl()} ${levelName()}</div><div class="stats"><span class="sub">經驗值</span><span class="score">${s.xp%100}/100 XP</span></div><div class="progress"><div style="width:${s.xp%100}%"></div></div><div class="sub">累積 ${s.xp} XP · 每 100 XP 升級</div><hr class="divider"><div class="stats"><span class="sub">寵物 Lv.${petLvl()}</span><strong>🍪 ${s.petFood} 份飼料</strong></div><div class="sub">餵食累積 ${s.petFeeds%3}/3 · 每 3 次升級</div><div class="badgechips"><span class="badgechip">🏅 ${levelName()}</span>${s.logs.length?'<span class="badgechip">🐾 學習夥伴</span>':''}</div>${s.petFood?'<button class="btn small secondary wide" style="margin-top:10px" data-action="feed">🍪 餵食寵物</button>':'<div class="petbubble">完成一回合，就能獲得 1 份寵物飼料</div>'}</div></div></div></aside>`}
function steps(){const names=['自我觀察','自我評價','自我增強','成果留存'];const active=s.phase==='review'?1:s.phase==='reward'?2:s.phase==='result'?3:0;return `<div class="stepbar" aria-label="目前進度">${names.map((n,i)=>`<span class="step ${i===active?'on':i<active?'done':''}">${i+1} ${n}</span>`).join('')}</div>`}
function head(title,desc){return `<h2>${title}</h2><p class="muted">${desc}</p>`}
function teacherTip(text){return s.teacher?`<div class="teacher">👩‍🏫 <b>教師帶領提示：</b>${text}</div>`:''}
function welcome(){return `<div class="hero"> <span class="pill">給想練習自律的你</span><h1>不用一次做到完美。<br>先完成一小步，就很棒。</h1><p>第一次選擇現在的狀態、完成三次小挑戰、回顧自己的學習，最後決定怎麼犒賞自己。</p></div><section class="panel">${head('今天的自律練習，從這裡開始','每回合都能自己選任務和時間。完成三回合後，會產生專屬學習成果。')}<div class="grid"><div class="micro"><strong>① 看見自己</strong><span>觀察現在的狀態，完成微目標</span></div><div class="micro"><strong>② 評估自己</strong><span>和原本目標比較，再想想如何調整</span></div><div class="micro"><strong>③ 肯定自己</strong><span>擲骰抽選犒賞，保有自己決定的權利</span></div><div class="micro"><strong>④ 留下成果</strong><span>下載一份今天的學習紀錄</span></div></div><div class="actions">${b(s.round?'繼續上次的練習 →':'開始今天的練習 →','begin')}</div></section>`}
function chooseState(){return `<section class="panel">${head('開始前｜你現在是哪一種狀態？','先觀察自己，不需要選「看起來比較厲害」的答案。')}${teacherTip('讓學生自行選擇目前最接近的狀態；請避免把任何選項當成能力高低的標籤。')}<div class="grid">${DATA.map(d=>`<button class="card" data-state="${d.id}"><span class="em">${d.emoji}</span><strong>${d.state}</strong><span class="muted smalltext">練習：${d.name}</span></button>`).join('')}</div><div class="note">💡 六種狀態沒有對錯，今天的你也可以和昨天不同。</div></section>`}
function chooseSkill(){const picked=DATA.find(d=>d.id===s.state)||DATA[0];return `<section class="panel">${head(s.round===0?'選一張能力卡':`第 ${s.round+1} / 3 回合｜選一張能力卡`,'依照你一開始選的狀態推薦能力卡，也可以自由選其他能力。')}${teacherTip('推薦不是診斷，學生可自由改選能力卡；重點是讓他自己選擇想練習的行動。')}<div class="note">你剛剛選的是：<b>${esc(picked.state)}</b><br>推薦：<b>${picked.emoji} ${picked.name}</b> — ${picked.focus}</div><div class="grid">${[picked,...DATA.filter(x=>x.id!==picked.id)].map(d=>`<button class="card ${s.skill===d.id?'selected':''}" data-skill="${d.id}"><span class="em">${d.emoji}</span><strong>${d.name}${d.id===picked.id?'　✨ 推薦':''}</strong><span class="muted smalltext">${d.focus}</span></button>`).join('')}</div><div class="actions">${s.round===0?b('← 返回狀態','backState','secondary'):''}${b('選好能力卡 →','toTask')}</div></section>`}
function chooseTask(){const d=skill();return `<section class="panel">${head(`${d.emoji} ${d.name}｜把目標縮成一小步`,'選一張微目標拆解卡，或自行寫下今天要完成的小任務。')}${teacherTip('可讓學生使用自己的課本或習作，依程度調整任務內容；任務拆解比追求速度更重要。')}<div class="task-options">${d.tasks.map((t,i)=>`<button class="card ${s.task===i?'selected':''}" data-task="${i}"><strong>${esc(t[0])}</strong><span class="muted smalltext">${esc(t[1])}</span></button>`).join('')}</div><label class="field">我的小任務（可自行修改）<textarea id="customGoal" placeholder="例如：先寫完數學習作第 12 頁的 2 題">${esc(s.custom||task()[1])}</textarea></label><label class="field">我想挑戰多久？（1–60 分鐘）<input type="number" id="timeInput" min="1" max="60" value="${s.minutes}" inputmode="numeric"></label><div class="note warm">時間是幫助你開始的工具，不是考試。提前完成或中途卡住，都可以真實記錄。</div><div class="actions">${b('← 更換能力卡','backSkill','secondary')}${b('開始計時挑戰 →','startTask')}</div></section>`}
function challenge(){const t=task();const mm=Math.floor(s.timerRemaining/60).toString().padStart(2,'0'),ss=(s.timerRemaining%60).toString().padStart(2,'0');return `<section class="panel">${head(`第 ${s.round+1} 回合｜現在開始實際做！`,'照著自己的小目標完成任務，不必急著一次做完。')}${teacherTip('學生實際操作紙本學習材料；教師可示範如何拆小任務，不將計時秒數當作競賽。')}<div class="goalbox"><span class="pill">${skill().emoji} ${skill().name}</span><h3 style="margin-top:10px">${esc(t[0])}</h3><p>${esc(s.custom)}</p></div><div class="timer" role="timer" aria-label="倒數計時">${mm}:${ss}</div><div class="actions no-print">${b(ticker?'⏸ 暫停':'▶ 開始／繼續','toggleTimer','secondary')}${b('↻ 重設時間','resetTimer','outline')}</div><h3 style="margin-top:20px">微步驟提醒</h3><p class="muted smalltext">這是參考步驟，不一定要全部完成；可以照自己的狀況調整。</p>${t[2].map((x,i)=>`<label class="checkline"><input type="checkbox" data-step="${i}" ${s.steps[i]?'checked':''}><span>${esc(x)}</span></label>`).join('')}<div class="actions">${b('✅ 完成嘗試','toCheck')}</div></section>`}
function roundCheck(){return `<section class="panel">${head('這次挑戰，我做到了哪些？','先記錄真正發生的事，還不需要評分自己的好壞。')}<div class="note">今天的目標：<b>${esc(s.custom)}</b><br>原本設定：${s.minutes} 分鐘</div><label class="field">我的實際情況<select id="outcome"><option value="完成目標">完成原本的小目標</option><option value="完成一部分">完成一部分</option><option value="認真嘗試但卡住">有認真嘗試，但遇到卡關</option></select></label><label class="field">請用一句話說明，你實際完成或嘗試了什麼？<textarea id="actual" placeholder="例如：我完成第一題，第二題做到一半。"></textarea></label><div class="note warm">沒有完成全部不會扣分。認真記錄卡關的地方，也是自我觀察的一部分。</div><div class="actions">${b('← 回到計時挑戰','backWork','secondary')}${b('記錄本回合＋領取 XP →','claim')}</div></section>`}
function gain(){const last=s.logs.at(-1);return `<section class="panel">${head('✨ 已記錄你的努力！','先看看自己完成的行動，再繼續下一回合。')}<div class="reward"><div class="bigemoji">🌟</div><h2>+35 XP</h2><p>這是「完成挑戰與真實紀錄」的遊戲回饋，不是正確率評分。</p></div><div class="reviewrow"><b>第 ${s.round} 回合｜${esc(last.skill)} · ${esc(last.title)}</b><p>目標：${esc(last.goal)}</p><p>實際：${esc(last.actual)}</p></div><p class="summaryhint">🍪 寵物飼料 +1，可以點右側（手機畫面在上方）的「餵食寵物」。</p><div class="actions">${b(s.round>=3?'三回合完成，進入自我評價 →':'開始下一回合 →','nextRound')}</div></section>`}
function review(){return `<section class="panel">${head('② 自我評價｜我和自己的目標比一比','你已完成至少三回合。現在只回答兩題，想想什麼有幫助、下次怎麼做。')}${teacherTip('引導學生將實際行為與自己的目標比較，盡量不用「誰比較快」作為評價標準。')}<div class="rounds">${s.logs.map((l,i)=>`<span class="round earned">✓ 第 ${i+1} 回合：${esc(l.skill)}</span>`).join('')}</div><h3 style="margin-top:20px">三回合簡要回顧</h3>${s.logs.map((l,i)=>`<div class="reviewrow"><b>${i+1}. ${esc(l.title)}</b><div class="smalltext">自己設定：${esc(l.goal)}</div><div class="smalltext">實際嘗試：${esc(l.actual)}（${esc(l.outcome)}）</div></div>`).join('')}<label class="field">第 1 題｜回頭看這三次挑戰，你覺得自己哪個方法最有幫助？為什麼？<textarea id="final1" placeholder="例如：先寫一題比較容易開始，因為不會覺得整份作業很可怕。">${esc(s.final1)}</textarea></label><label class="field">第 2 題｜和原本的目標比較，下次你會保留或調整什麼？<textarea id="final2" placeholder="例如：我想繼續先做兩題，但把手機放遠一點。">${esc(s.final2)}</textarea></label><div class="actions">${b('完成自我評價，選擇獎勵 →','toReward')}</div></section>`}
function reward(){const r=s.selectedReward===null?null:REWARDS[s.selectedReward];return `<section class="panel">${head('③ 自我增強｜決定如何犒賞自己','擲骰提供一個獎勵靈感。由你決定要不要接受，也能選其他適合自己的方式。')}${teacherTip('自我增強包含對努力的自我肯定，不必提供金錢獎勵；避免以高糖飲品或消費作為固定標準。')}<div class="reward"><div class="bigemoji">${r?r.emoji:'🎲'}</div><h2>${r?esc(r.name):'今天的獎勵提案'}</h2><p>${r?esc(r.text):'擲一顆六面骰，看看會抽到哪一種犒賞。'}</p>${r?`<p class="muted smalltext">${esc(r.tip)}</p>`:''}</div><div class="actions">${b('🎲 擲骰產生提案','diceReward','secondary')}</div><label class="field">我真正決定給自己的獎勵（可以不花錢）<input id="rewardText" value="${esc(s.rewardChoice)}" placeholder="例如：休息10分鐘／吃自己喜歡的點心／看一集動畫"></label><div class="note">完成目標值得被肯定；如果今天部分卡關，也可以肯定自己有誠實觀察、嘗試與調整。犒賞不需要很貴。</div><div class="actions">${b('完成，產生我的學習成果 →','finish')}</div></section>`}
function report(){const end=s.completionDate?new Date(s.completionDate):new Date();return `<section class="panel" id="report">${head('📘 我的自律學習成果','這份紀錄可以下載或列印成 PDF，保存今天完成的具體行動。')}<div class="result-grid"><div><span class="sub">今日挑戰</span><strong>${s.logs.length} 回合</strong></div><div><span class="sub">累積經驗值</span><strong>${s.xp} XP</strong></div><div><span class="sub">目前等級</span><strong>Lv.${lvl()}</strong></div></div><p class="smalltext muted" style="margin-top:12px">完成日期：${end.toLocaleDateString('zh-TW')}　｜　稱號：${levelName()}　｜　寵物：Lv.${petLvl()}</p><h3 style="margin-top:18px">一、我的微目標紀錄</h3>${s.logs.map((l,i)=>`<div class="history"><b>第 ${i+1} 回合｜${esc(l.skill)} · ${esc(l.title)}</b><p>我的目標：${esc(l.goal)}</p><p>預計時間：${l.minutes} 分鐘；完成情況：${esc(l.outcome)}</p><p>實際行動：${esc(l.actual)}</p></div>`).join('')}<h3 style="margin-top:18px">二、我的自我評價</h3><div class="resultnote">哪個方法最有幫助？\n${esc(s.final1)}\n\n下次想保留或調整什麼？\n${esc(s.final2)}</div><h3 style="margin-top:18px">三、我的自我增強</h3><div class="resultnote">今天決定給自己的犒賞：${esc(s.rewardChoice)}</div><div class="note">下次學習時，可以再次從觀察狀態、訂出小目標開始。自律不是不會分心，而是逐漸學會看見自己、做出調整。</div><div class="actions no-print">${b('⬇ 下載文字成果','download')}${b('🖨 列印／另存 PDF','print','secondary')}${b('開始新的三回合','restart','outline')}</div></section>`}
function screen(){const stages={welcome,chooseState,chooseSkill,chooseTask,challenge,roundCheck,gain,review,reward,report};const component=stages[s.phase]||welcome;app.innerHTML=`${steps()}<div class="layout"><div>${component()}</div>${side()}</div>`;const hp=document.getElementById('headerProgress');if(hp){hp.innerHTML=`<span>Lv.${lvl()}｜${s.xp%100}/100 XP</span><div class="progress"><div style="width:${s.xp%100}%"></div></div>`}save()}
function stop(){if(ticker){clearInterval(ticker);ticker=null}}function tickStart(){if(ticker){stop();screen();return}ticker=setInterval(()=>{if(s.timerRemaining>0){s.timerRemaining--;const e=document.querySelector('.timer');if(e)e.textContent=`${String(Math.floor(s.timerRemaining/60)).padStart(2,'0')}:${String(s.timerRemaining%60).padStart(2,'0')}`;save()}else{stop();toast('時間到了！你可以繼續或記錄現在的進度。');screen()}},1000);screen()}
function closeFinishDialog(){const d=document.getElementById('finishDialog');d.classList.add('hidden');}
function showFinishDialog(second){const d=document.getElementById('finishDialog');document.getElementById('finishDialogHeading').textContent=second?'確定完成這次挑戰了嗎？':'你已經完成了嗎？';document.getElementById('finishDialogCopy').textContent=second?'如果已經完成，或已認真嘗試並願意記錄成果，就選「是，開始記錄」；還想繼續就選「否，繼續挑戰」。':'如果還沒完成，可以再堅持一下！如果已經完成，也很棒。先回到任務確認一下，再按一次「完成嘗試」就能記錄成果。';const actions=document.getElementById('finishDialogActions');actions.replaceChildren();const button=(label,kind,fn)=>{const b=document.createElement('button');b.type='button';b.className='btn '+kind;b.textContent=label;b.onclick=fn;actions.appendChild(b)};if(second){button('否，繼續挑戰','secondary',closeFinishDialog);button('是，開始記錄','',()=>{closeFinishDialog();stop();s.phase='roundCheck';screen();window.scrollTo({top:0,behavior:'smooth'})})}else{button('好的，回去確認','',closeFinishDialog)}d.classList.remove('hidden');actions.querySelector('button')?.focus()}
function act(action){switch(action){case'begin':s.phase=s.round>=3?'review':(s.state?'chooseSkill':'chooseState');break;case'backState':s.phase='chooseState';break;case'backSkill':s.phase='chooseSkill';break;case'toTask':if(!s.skill){toast('請先選一張能力卡');return}s.phase='chooseTask';s.custom=task()[1];break;case'startTask':{const el=document.getElementById('customGoal'),mins=Number(document.getElementById('timeInput').value);if(!el.value.trim()){toast('請先寫下這次的小目標');return}if(!Number.isInteger(mins)||mins<1||mins>60){toast('挑戰時間請填 1 到 60 分鐘');return}s.custom=el.value.trim();s.minutes=mins;s.timerRemaining=mins*60;s.steps=[false,false,false];s.wasStarted=false;s.finishPromptCount=0;s.phase='challenge';break}case'toggleTimer':tickStart();return;case'resetTimer':stop();s.timerRemaining=s.minutes*60;break;case'toCheck':{s.finishPromptCount=(s.finishPromptCount||0)+1;if(s.finishPromptCount===1){showFinishDialog(false)}else{showFinishDialog(true)}return}case'backWork':s.phase='challenge';break;case'claim':{const actual=document.getElementById('actual')?.value.trim(),outcome=document.getElementById('outcome')?.value;if(!actual){toast('請先寫一句實際完成或嘗試的內容');return}s.logs.push({skill:skill().name,title:task()[0],goal:s.custom,minutes:s.minutes,outcome,actual,steps:s.steps.slice()});s.round++;s.xp+=35;s.petFood++;s.phase='gain';toast('完成紀錄！獲得 35 XP 和 1 份飼料');break}case'nextRound':s.phase=s.round>=3?'review':'chooseSkill';s.skill=null;s.task=0;s.custom='';s.finishPromptCount=0;break;case'toReward':{const a=document.getElementById('final1').value.trim(),c=document.getElementById('final2').value.trim();if(!a||!c){toast('請完成兩題自我評價');return}s.final1=a;s.final2=c;s.phase='reward';break}case'diceReward':s.selectedReward=Math.floor(Math.random()*6);s.rewardChoice=REWARDS[s.selectedReward].text;break;case'finish':{const v=document.getElementById('rewardText')?.value.trim();if(!v){toast('請寫下自己決定的犒賞方式');return}s.rewardChoice=v;s.completionDate=new Date().toISOString();s.phase='report';break}case'feed':if(s.petFood<1){toast('完成挑戰即可獲得飼料');return}s.petFood--;s.petFeeds++;toast(`🍪 已餵食！寵物等級：${petLvl()}`);break;case'download':{const content=`學習冒險島｜我的自律學習成果\n日期：${new Date(s.completionDate).toLocaleDateString('zh-TW')}\n完成：${s.logs.length}回合　累積XP：${s.xp}　等級：Lv.${lvl()} ${levelName()}　寵物：Lv.${petLvl()}\n\n【自我觀察】\n${s.logs.map((l,i)=>`第${i+1}回合 ${l.skill}｜${l.title}\n目標：${l.goal}\n設定時間：${l.minutes}分鐘\n完成情況：${l.outcome}\n實際行動：${l.actual}`).join('\n\n')}\n\n【自我評價】\n最有幫助的方法：${s.final1}\n下一次的調整：${s.final2}\n\n【自我增強】\n給自己的犒賞：${s.rewardChoice}\n\n此為自我學習紀錄，非能力測驗。`;const file=new Blob(['\ufeff',content],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download='學習冒險島_自律學習成果.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}case'print':window.print();return;case'restart':if(!confirm('確定開始新的一次練習？請先下載成果，舊紀錄會被清除。'))return;{let old=s; s=initial();s.teacher=old.teacher;s.xp=old.xp;s.petFood=old.petFood;s.petFeeds=old.petFeeds;break}}
screen();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const target=e.target.closest('[data-state],[data-skill],[data-task],[data-action]');if(!target)return;if(target.dataset.state){s.state=target.dataset.state;s.skill=target.dataset.state;s.task=0;s.phase='chooseSkill';screen();return}if(target.dataset.skill){s.skill=target.dataset.skill;s.task=0;screen();return}if(target.dataset.task!==undefined){s.task=Number(target.dataset.task);s.custom=task()[1];screen();return}if(target.dataset.action)act(target.dataset.action)});
document.addEventListener('change',e=>{if(e.target.matches('[data-step]')){s.steps[Number(e.target.dataset.step)]=e.target.checked;save()}});
document.getElementById('teacherBtn').onclick=()=>{s.teacher=!s.teacher;document.getElementById('teacherBtn').textContent=s.teacher?'👩‍🏫 教師提示：開':'👩‍🏫 教師提示：關';screen()};document.getElementById('teacherBtn').textContent=s.teacher?'👩‍🏫 教師提示：開':'👩‍🏫 教師提示：關';
document.getElementById('helpBtn').onclick=()=>{alert('玩法：① 第一次先選學習狀態，後續不重複詢問 ② 每回合選一張能力卡與微目標 ③ 自訂時間並實際挑戰（完成嘗試須按兩次確認） ④ 誠實記錄完成情況、獲得 35 XP ⑤ 重複至少三回合 ⑥ 回答兩題自我評價 ⑦ 擲骰取得犒賞靈感，也可自行決定獎勵 ⑧ 下載成果。每 100 XP 升一級；每回合獲得一份飼料，可手動餵食寵物，累積三次餵食升一級。')};
screen();
</script></body></html>
