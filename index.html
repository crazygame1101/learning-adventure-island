const btn=(t,a,cls='')=>`<button type="button" class="btn ${cls}" data-act="${a}">${t}</button>`;
const short=(a,i)=>`<div class="roundcard"><b>第 ${i+1} 回合｜${esc(a.skill)}：${esc(a.title)}</b><div class="muted tiny">預計 ${a.planned} 分鐘 · 實際計時 ${timefmt(a.elapsed)} · +${a.xp} XP</div><p>目標：${esc(a.goal)}</p><p>完成情況：${esc(a.outcome)}<br>紀錄：${esc(a.actual)}</p></div>`;
function header(){el('greeting').textContent=s.name?`${s.name} 的學習旅程 · ${title()}`:'一小步，也能累積改變';el('lvstat').textContent=`Lv.${lv()}`;el('xpstat').textContent=`${s.xp%100} / 100 XP`;el('xpfill').style.width=(s.xp%100)+'%'}
const timefmt=n=>`${String(Math.floor((n||0)/60)).padStart(2,'0')}:${String((n||0)%60).padStart(2,'0')}`;
const progress=()=>`<div class="stepnav noprint">${['起始準備','三回合挑戰','自我評價','自我增強','成果報告'].map((t,i)=>{let a=['intro','home'].includes(s.page)?0:s.page==='review'?2:s.page==='reward'?3:s.page==='report'?4:s.page==='history'?4:1;return `<span class="${a===i?'active':''}">${i+1} ${t}</span>`}).join('')}</div>`;
function petbar(){const ready=s.food>0&&s.xp>=feedGoal();return `<div class="petbar"><span class="icon">${avatar()}</span><div style="flex:1"><b>${esc(s.name||'冒險家')}的神祕夥伴｜${hatched() ? pet()[2]+' Lv.'+petLv():'尚未孵化的冒險蛋'}</b><div class="tiny muted">${hatched()?'已孵化！繼續餵食會成長':'裡面是哪種夥伴？等孵化就知道！'} · 餵食 ${s.feeds}${hatched()?'':' / 3'} 次 · 🍪 飼料 ${s.food} 份</div><div class="tiny muted">${ready?'可以餵食囉！':`下次餵食需要累積 ${feedGoal()} XP（目前 ${s.xp} XP）與 1 份飼料`}</div></div>${ready?btn('🍪 手動餵食','feed','soft noprint'):''}</div>`}

function intro(){return `<div class="hero"><span class="eyebrow">WELCOME TO THE QUEST</span><h1>🌌 歡迎來到學習冒險島！</h1><p class="story">每個冒險家都有自己想突破的難關：有時候是拖延，有時候是分心，也可能是遇到一題不會就想放棄。這裡沒有排行榜，也不用一次變得很厲害。只要選一個小目標，踏出第一步，就能把努力慢慢累積成自己的成長紀錄。<br>第一次來到島上，先取一個專屬暱稱，領取一顆隨機分配的神祕蛋。夥伴還躲在蛋裡，等你透過任務累積經驗、收集飼料、親手餵食，才會孵化與你相見。以後再打開這個網站，你就會直接回到自己的冒險首頁。</p></div><section class="panel"><h2>🪪 第一次報到｜建立冒險家檔案</h2><label class="field" for="nick">請問要怎麼稱呼你呢？</label><input id="nick" type="text" maxlength="24" value="${esc(s.name)}" placeholder="請輸入暱稱，不用真實姓名"><label class="field">今天的心情（可選一個）</label><div class="grid3">${[['😊','開心有精神'],['🙂','還不錯'],['😐','普通'],['😴','有點累'],['😟','有點煩躁'],['😣','有壓力']].map(x=>`<button class="choice ${s.mood===x[1]?'selected':''}" data-mood="${x[1]}"><strong>${x[0]} ${x[1]}</strong></button>`).join('')}</div><h3>🥚 神祕蛋已經在等你！</h3><p class="muted">島上藏著五種可能的冒險夥伴：老虎、孔雀、無尾熊、貓頭鷹和變色龍。<b>你不能先偷看，也不需要選擇。</b>建立檔案時，系統會替你秘密分配其中一位。透過挑戰累積經驗、取得飼料，親手餵食三次後才會揭曉牠的身分。</p><div class="mysteryPreview"><span style="font-size:48px">🥚</span><div><b>？？？ · 未知的冒險夥伴</b><div class="tiny muted">五種可能性，一個陪你成長的夥伴；不是人格測驗，也不評分個性。</div></div></div><div class="hint"><b>🎮 冒險守則</b><br>① 第一次報到後，往後直接進入個人首頁。<br>② 每趟選擇學習狀態，完成三回合微任務、計時與如實記錄。<br>③ 回顧學習方法，擲骰選擇適合自己的獎勵。<br>④ 每完成一回合可獲得 35 XP 與一份飼料；每累積 100 XP 升一級。當 XP 達到餵食門檻，就能手動餵食；餵食三次後寵物孵化。<br>⑤ 成果與歷史紀錄只保存在這台裝置的瀏覽器。</div><div class="buttons">${btn('建立我的冒險檔案 →','register')}</div></section>`}

function home(){return `<div class="hero"><span class="eyebrow">YOUR ADVENTURE BASE</span><h1>嗨，${esc(s.name)}！你的冒險基地準備好了 ✨</h1><p>這是你的專屬學習空間。每一次回來，只要挑選一個想練習的小目標，就能累積 XP、解鎖稱號，慢慢照顧你的神祕夥伴。</p></div><section class="panel"><div class="results"><div><span class="tiny muted">冒險者等級</span><b>Lv.${lv()}</b></div><div><span class="tiny muted">累積經驗</span><b>${s.xp} XP</b></div><div><span class="tiny muted">完成的冒險</span><b>${s.archive.length} 次</b></div></div><div class="buttons">${btn('⚔️ 開始今天的三回合挑戰','startJourney')}${btn('📖 查看過往成果','history','outline')}</div><p class="tiny muted" style="margin-top:14px">請留意：資料保存在目前瀏覽器。換裝置或清除網站資料，可能無法找回紀錄。</p></section>`}

function state(){return `<section class="panel"><span class="eyebrow">自我觀察 · 只在第一次選擇</span><h2>今天，你想先改善哪一種學習狀況？</h2><p class="muted">選擇最符合自己的狀況，後面兩回合不會重複詢問。你仍然可以自由挑戰不同能力。</p><div class="grid2">${DATA.map(x=>`<button class="choice ${s.state===x.id?'selected':''}" data-state="${x.id}"><strong>${x.emoji} ${esc(x.state)}</strong><small>推薦能力：${x.name}</small></button>`).join('')}</div><div class="buttons">${btn('進入第一回合，挑選能力 →','stateNext')}</div></section>`}
function choose(){return `<section class="panel"><span class="eyebrow">第 ${s.round+1} / 3 回合 · 選擇練習方向</span><h2>今天先練哪一種能力？</h2><p class="muted">六張卡都可以選。建議從你剛才的狀態開始，也可以換一種想練習的能力。</p><div class="grid2">${DATA.map(x=>`<button class="choice ${s.skill===x.id?'selected':''}" data-skill="${x.id}"><strong>${x.emoji} ${x.name} ${s.state===x.id?'⭐ 推薦':''}</strong><small>${x.focus}</small></button>`).join('')}</div><div class="buttons">${btn('下一步：挑選微目標 →','chooseNext')}</div></section>`}
function tasks(){return `<section class="panel"><span class="eyebrow">第 ${s.round+1} 回合 · 把大目標變小步驟</span><h2>${ability().emoji} ${ability().name}｜選一張微目標卡</h2><p class="muted">每張卡都把一件大事拆成三個可以開始的小步驟。選完後也能自行修改任務。</p><div class="stack">${ability().tasks.map((t,i)=>`<button class="choice ${s.task===i?'selected':''}" data-task="${i}"><strong>${i+1}. ${esc(t[0])}</strong><small>${esc(t[1])}</small></button>`).join('')}</div><div class="hint"><b>🎒 微步驟提醒</b><div id="micropreview">${mission()[2].map((t,i)=>`<div>✓ ${i+1}. ${esc(t)}</div>`).join('')}</div></div><label class="field" for="goal">這次我想完成的具體目標</label><textarea id="goal" data-suggest="${esc(mission()[1])}" placeholder="${esc(mission()[1])}" onfocus="this.placeholder=''" onblur="if(!this.value)this.placeholder=this.dataset.suggest">${esc(s.goal)}</textarea><p class="tiny muted">點進欄位即可自行填寫目標；灰色字只是範例，不會直接算作你的回答。</p><label class="field" for="minutes">我想挑戰幾分鐘？（1–60 分鐘）</label><input type="number" id="minutes" min="1" max="60" value="${s.planned||5}"><div class="buttons">${btn('← 重新選能力','choose','outline')}${btn('開始計時挑戰 →','startTask')}</div></section>`}
function challenge(){return `<section class="panel"><span class="eyebrow">第 ${s.round+1} 回合 · 計時挑戰</span><h2>⏳ 現在，專心完成這一小步</h2><div class="hint"><b>${ability().emoji} ${esc(mission()[0])}</b><div>${esc(s.goal)}</div></div><div class="timer" id="clock">${timefmt(s.left)}</div><p class="muted" style="text-align:center">這不是速度競賽。卡住時可以暫停、看看任務，再決定下一步。</p><div class="buttons">${btn(s.running?'⏸ 暫停':'▶ 開始／繼續','toggleClock','soft')}${btn('↺ 重新計時','resetClock','outline')}</div><h3>我的三個小步驟</h3>${mission()[2].map((t,i)=>`<label class="check"><input type="checkbox" data-micro="${i}" ${s.micro&&s.micro[i]?'checked':''}><span>${esc(t)}</span></label>`).join('')}<div class="buttons">${btn('完成嘗試','tryFinish')}</div></section>`}
function log(){return `<section class="panel"><span class="eyebrow">第 ${s.round+1} 回合 · 誠實記錄</span><h2>📝 剛才我做到了哪些？</h2><p class="muted">原本目標：${esc(s.goal)}<br>實際計時：${timefmt(s.elapsed)} / 設定 ${s.planned} 分鐘</p><h3>我的實際情況（請選一項）</h3><div class="outcomeRow">${[['完成原本的小目標','完成原本的小目標'],['完成一部分','完成一部分'],['認真嘗試但卡住','認真嘗試但卡住']].map(x=>`<label class="check"><input type="radio" name="outcome" value="${x[0]}" ${s.outcome===x[0]?'checked':''}><span>${x[1]}</span></label>`).join('')}</div><label class="field" for="actual">剛剛發生什麼事？請用一句話說明情況</label><textarea id="actual" placeholder="例如：我完成一題，第二題算到一半才發現有一個步驟不懂。">${esc(s.actual)}</textarea><div class="warn">即使只完成一部分，也可以誠實記錄。這份紀錄幫助你看見進度，不需要假裝全部都會。</div><div class="buttons">${btn('← 回到挑戰','challenge','outline')}${btn('記錄成果，領取 35 XP →','claim')}</div></section>`}
function earned(){const a=s.logs.at(-1);return `<section class="panel"><div class="hero"><div class="eyebrow">ROUND ${s.round} COMPLETE</div><h1>這一小步，完成紀錄了！ ✨</h1><p>你獲得 35 XP，還有一份可以親手餵給夥伴的飼料。XP 只代表完成了遊戲任務與紀錄，不等於心理能力分數。</p></div>${short(a,s.round-1)}<div class="buttons">${btn(s.round===3?'進入三回合自我評價 →':'開始下一回合 →','nextRound')}</div></section>`}
function review(){return `<section class="panel"><span class="eyebrow">自我評價 · 回顧三次挑戰</span><h2>🔎 和剛開始的自己比一比</h2><p class="muted">我們先比較原先目標和實際行動，再回答三個問題。這裡沒有分數高低的排名。</p>${s.logs.map(short).join('')}<label class="field" for="selfRating">1. 請回顧這三次的挑戰，你覺得從剛剛到現在自己的學習狀態，0～5 分有幾分？</label><div class="ratingrow" role="radiogroup" aria-label="整體學習狀態">${[0,1,2,3,4,5].map(n=>`<span><input type="radio" name="selfRating" value="${n}" id="sr${n}" ${s.selfRating===n?'checked':''}><label for="sr${n}">${n}</label></span>`).join('')}</div><p class="tiny muted">0＝目前很難進入學習狀態；5＝現在很能投入。這是主觀狀態評分，不是六題自我效能自評總分。</p><label class="field" for="helpful">2. 你覺得自己哪個方法最有幫助？為什麼？</label><textarea id="helpful" placeholder="例如：把目標拆成兩題，讓我比較願意開始。">${esc(s.reviewHelp)}</textarea><label class="field" for="next">3. 下次讀書時，你會保留或調整什麼讀書方式呢？</label><textarea id="next" placeholder="例如：我會繼續把手機放遠，先做五分鐘。">${esc(s.reviewNext)}</textarea><div class="buttons">${btn('下一步：為努力的自己選獎勵 →','saveReview')}</div></section>`}
function reward(){return `<section class="panel"><span class="eyebrow">自我增強 · 自己決定如何肯定努力</span><h2>🎲 今天要怎麼犒賞自己？</h2><p class="muted">骰子會給你一個具體獎勵提案，想重抽幾次都可以。最後由你自己決定要選哪一種方式；不一定要花錢，也不用照單全收。</p><div class="hero" style="text-align:center"><div style="font-size:56px">${s.drawn>=0?REWARDS[s.drawn][0]:'🎲'}</div><h2>${s.drawn>=0?esc(REWARDS[s.drawn][1]):'準備好抽取你的獎勵提案了嗎？'}</h2></div><div class="buttons">${btn('🎲 擲骰子／再抽一次','dice','soft')}</div><label class="field" for="rewardChoice">我最後決定給自己的獎勵</label><input id="rewardChoice" type="text" value="${esc(s.rewardChoice)}" placeholder="例如：休息10分鐘、看三部短片、對自己說一句鼓勵"><div class="hint">你可以選擇符合目前時間、家庭規範與身體需求的獎勵。獎勵是肯定努力，不是要求自己一定要消費。</div><div class="buttons">${btn('完成冒險，產生我的學習成果 →','finish')}</div></section>`}
function practiceStats(record){const entries=DATA.map(d=>{const ls=record.logs.filter(x=>x.skillId===d.id);return {label:d.emoji+' '+d.name,count:ls.length,seconds:ls.reduce((a,x)=>a+x.elapsed,0)}});const max=Math.max(1,...entries.map(x=>x.count));return `<div class="stack">${entries.map(x=>`<div class="abilityrow"><div class="metarow"><b>${x.label}</b><span>${x.count} 回合 · ${timefmt(x.seconds)}</span></div><div class="abilitytrack"><div style="width:${(x.count/max)*100}%"></div></div></div>`).join('')}</div><p class="tiny muted">這張圖表示實際練習的回合次數與時間，不是心理特質或能力高低分數。</p>`}

function report(record=s){const end=record.completedAt?new Date(record.completedAt):new Date();const roundXp=record.logs.reduce((a,x)=>a+x.xp,0);return `<section class="panel" id="printreport"><div class="eyebrow">MISSION COMPLETE</div><h2>📘 ${esc(record.name)} 的自律學習成果</h2><p class="muted">完成日期：${end.toLocaleString('zh-TW')}　｜　夥伴：${avatar(record)} ${hatched(record)?(PETS.find(p=>p[0]===record.pet)||PETS[0])[2]:'孵化中的冒險蛋'}</p><div class="results"><div><span class="tiny muted">完成回合</span><b>${record.logs.length}</b></div><div><span class="tiny muted">本次 XP</span><b>${roundXp}</b></div><div><span class="tiny muted">實際計時</span><b>${timefmt(record.logs.reduce((a,x)=>a+x.elapsed,0))}</b></div></div><p class="tiny muted">累積 XP：${record.xp}｜Lv.${Math.floor(record.xp/100)+1}｜寵物：${hatched(record)?'Lv.'+petLv(record):'尚未孵化'}｜已餵食 ${record.feeds} 次</p><h3>一、三回合的學習紀錄</h3>${record.logs.map(short).join('')}<h3>二、這次練習了哪些能力？</h3>${practiceStats(record)}<h3>三、我的自我評價與自我增強</h3><p>完成後的學習狀態：${record.selfRating}/5（主觀自評）</p><p><b>最有幫助的方法：</b>${esc(record.reviewHelp)}</p><p><b>下次保留或調整：</b>${esc(record.reviewNext)}</p><p><b>我最後決定給自己的獎勵：</b>${esc(record.rewardChoice)}</p><div class="hint">比起分數高低，更重要的是你能清楚說出自己做了什麼、遇到什麼困難、下次想怎麼調整。</div><div class="buttons noprint">${btn('⬇ 下載學習成果（文字）','export')}${btn('🖨 列印／另存 PDF','print','soft')}${record===s?btn('回到我的冒險基地','new','outline'):btn('← 返回歷史紀錄','history','outline')}</div></section>`}

function history(){const history=s.archive;return `<section class="panel"><h2>📚 我的歷史冒險紀錄</h2><p class="muted">只存在這台裝置的瀏覽器中；若清除網站資料，紀錄可能消失。可以下載文字檔另存。</p>${history.length?history.slice().reverse().map((r,i)=>`<div class="historycard"><div class="metarow"><b>${esc(r.name)}｜${new Date(r.completedAt).toLocaleDateString('zh-TW')}</b>${btn('查看成果','viewHistory','outline small').replace('data-act="viewHistory"',`data-act="viewHistory" data-index="${history.length-1-i}"`)}</div><div class="tiny muted">${r.logs.length} 回合 · ${timefmt(r.logs.reduce((a,x)=>a+x.elapsed,0))} · ${r.logs.reduce((a,x)=>a+x.xp,0)} XP</div></div>`).join(''):'<div class="hint">目前還沒有完成的歷史紀錄。完成第一趟冒險後就會出現在這裡。</div>'}<div class="buttons">${btn('← 回到正在進行的冒險','backHistory','outline')}</div></section>`}
function page(){const pages={intro,home,state,choose,tasks,challenge,log,earned,review,reward,report:()=>report(),history,historyReport:()=>report(s.archive[viewedHistory]||s)};return pages[s.page]?pages[s.page]():intro()}
function renderDock(){const dock=el('petDock');if(!dock)return;if(!s.profileReady){dock.innerHTML='';dock.classList.add('hidden');return}dock.classList.remove('hidden');const ready=s.food>0&&s.xp>=feedGoal();dock.innerHTML=`<span class="petheadicon" aria-hidden="true">${avatar()}</span><span class="petheadinfo"><b>${hatched()?pet()[2]+' Lv.'+petLv():'神祕蛋'}</b><small>🍪 ${s.food} 份 · 已餵 ${s.feeds} 次</small></span>${ready?btn('🍪 餵食','feed','small soft'):''}`}
function render(){header();app.innerHTML=progress()+page();renderDock();save()}
function switchPage(p){if(s.running)pauseClock();s.page=p;render();window.scrollTo({top:0,behavior:'instant'})}
function showDialog(title,text,actions){el('dialogTitle').textContent=title;el('dialogText').textContent=text;const target=el('dialogButtons');target.replaceChildren();actions.forEach(([label,fn,secondary])=>{const b=document.createElement('button');b.className='btn '+(secondary?'soft':'');b.textContent=label;b.onclick=()=>{el('dialog').classList.add('hidden');fn()};target.appendChild(b)});el('dialog').classList.remove('hidden');target.querySelector('button')?.focus()}
function timerStep(){if(!s.running)return;const now=Date.now();const diff=Math.max(0,Math.floor((now-s.lastTick)/1000));if(diff){s.elapsed+=Math.min(diff,s.left);s.left=Math.max(0,s.left-diff);s.lastTick+=diff*1000;if(s.left===0){pauseClock();showDialog('⏰ 時間到了！','你可以記錄目前做到的部分，也可以繼續調整目標、重新計時。',[['回到任務',()=>render()]])}else{if(el('clock'))el('clock').textContent=timefmt(s.left);save()}}}
function pauseClock(){timerStepCore();s.running=false;if(clock){clearInterval(clock);clock=null}}
function timerStepCore(){if(!s.running)return;const now=Date.now(),diff=Math.max(0,Math.floor((now-s.lastTick)/1000));s.elapsed+=Math.min(diff,s.left);s.left=Math.max(0,s.left-diff);s.lastTick=now}
function startClock(){if(s.running){pauseClock();render();return}if(s.left===0){s.left=s.planned*60} s.running=true;s.lastTick=Date.now();clock=setInterval(timerStep,500);render()}
function getAnswers(prefix){let arr=[];for(let i=0;i<6;i++){const q=document.querySelector(`input[name="${prefix}-${i}"]:checked`);if(!q)return null;arr.push(Number(q.value))}return arr}
function finalizeArchive(){if(!s.archive.some(x=>x.completedAt===s.completedAt)){const record=JSON.parse(JSON.stringify(s));delete record.archive;s.archive.push(record)}}
function txt(r){const x=[`學習冒險島｜${r.name} 的學習成果`,`日期：${new Date(r.completedAt).toLocaleString('zh-TW')}`,`完成回合：${r.logs.length}`,`本次實際計時：${timefmt(r.logs.reduce((a,l)=>a+l.elapsed,0))}`,`累積經驗：${r.xp} XP`,`夥伴：${hatched(r)?'已孵化':'尚未孵化'}，已餵食 ${r.feeds} 次`,'【三回合】',...r.logs.map((l,i)=>`第 ${i+1} 回合：${l.skill}｜${l.title}\n目標：${l.goal}\n預計：${l.planned}分 實際計時：${timefmt(l.elapsed)}\n結果：${l.outcome}\n發生的事：${l.actual}`),`學習狀態自評：${r.selfRating}/5`,`有效方法：${r.reviewHelp}`,`下次調整：${r.reviewNext}`,`給自己的獎勵：${r.rewardChoice}`,'說明：能力練習次數與 XP 均為遊戲行為紀錄，非正式心理量表。'];return x.join('\n\n')}
function exportText(r){const blob=new Blob(['\ufeff'+txt(r)],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='學習冒險島_學習成果.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function act(a,button){switch(a){
case'register':{const v=el('nick').value.trim();if(!v){alert('請先填寫暱稱。');return}s.name=v;s.pet=chooseMysteryPet();s.profileReady=true;switchPage('home');break}
case'home':switchPage('home');break;
case'resetAll':showDialog('⚠️ 確定要重新開始嗎？','這會永久清除這台瀏覽器內的冒險者資料、XP、寵物孵化進度、全部學習歷史與目前挑戰。清除後無法在本站恢復。', [['取消，保留紀錄',()=>render(),true],['我了解，繼續確認',()=>showDialog('🚨 最後確認：刪除全部紀錄','真的要刪掉所有進度嗎？包含過去的學習成果也會消失。', [['不刪除',()=>render(),true],['確定全部刪除',()=>{pauseClock();try{localStorage.removeItem(KEY)}catch(e){}s=fresh();viewedHistory=-1;switchPage('intro')} ]])]]);break;
case'startJourney':s.state='';s.round=0;s.logs=[];s.goal='';s.elapsed=0;s.diceCount=0;s.drawn=-1;s.rewardChoice='';s.reviewHelp='';s.reviewNext='';s.selfRating=3;s.completedAt='';s.confirmCount=0;switchPage('state');break;
case'stateNext':if(!s.state){alert('請先選擇一種目前的學習狀況');return}s.skill=s.state;switchPage('choose');break;
case'choose':switchPage('choose');break;
case'chooseNext':s.task=0;s.goal='';switchPage('tasks');break;
case'startTask':{const g=el('goal').value.trim(),m=Number(el('minutes').value);if(!g||!Number.isInteger(m)||m<1||m>60){alert('請輸入具體目標，並設定 1～60 分鐘。');return}s.goal=g;s.planned=m;s.left=m*60;s.elapsed=0;s.micro=[false,false,false];s.confirmCount=0;switchPage('challenge');break}
case'toggleClock':startClock();break;
case'resetClock':pauseClock();s.left=s.planned*60;s.elapsed=0;render();break;
case'tryFinish':{pauseClock();s.confirmCount++;const n=s.round;if(s.confirmCount===1){const msg=n===0?'加油！如果還沒完成，再堅持一下！如果已經完成給你掌聲。先回到任務再次確認，確認完再按一次「完成嘗試」唷！':'嘿！又是我，你已經完成了嗎？可以再努力一下，相信你正在進步的路上。\n先回到任務再次確認，再按一次「完成嘗試」就能記錄成果。';showDialog('再確認一下任務！',msg,[['好的，回去確認',()=>render()]])}else{const msg=n===2?'請給認真學習的自己掌聲，可以記錄成果；如果還想繼續挑戰，請返回挑戰。':'請給認真嘗試的自己掌聲，可以記錄成果；如果還想繼續挑戰，請返回挑戰。';showDialog('確定要記錄這次挑戰嗎？',msg,[['返回挑戰',()=>render(),true],['是，記錄成果',()=>switchPage('log')]])}break}
case'challenge':switchPage('challenge');break;
case'claim':{const v=el('actual').value.trim(),o=document.querySelector('input[name="outcome"]:checked');if(!o||!v){alert('請先勾選實際情況，並用一句話說明發生什麼事。');return}s.outcome=o.value;s.actual=v;s.logs.push({skillId:s.skill,skill:ability().name,title:mission()[0],goal:s.goal,planned:s.planned,elapsed:s.elapsed,outcome:s.outcome,actual:s.actual,xp:35,steps:s.micro||[]});s.round++;s.xp+=35;s.food++;switchPage('earned');break}
case'feed':if(s.food<1||s.xp<feedGoal())return;{const was=hatched();s.food--;s.feeds++;if(!was&&hatched())showDialog('🥚 冒險蛋孵化了！',`你的${pet()[2]}夥伴終於誕生！接下來牠會和你一起升級成長。`,[['太棒了！',()=>render()]]);else render()}break;
case'nextRound':if(s.round>=3){switchPage('review')}else{s.skill=s.state;s.task=0;s.goal='';s.outcome='';s.actual='';s.confirmCount=0;switchPage('choose')}break;
case'saveReview':{const v=el('helpful').value.trim(),w=el('next').value.trim();if(!v||!w){alert('請回答後面兩題反思。');return}s.selfRating=Number(document.querySelector('input[name="selfRating"]:checked')?.value??3);s.reviewHelp=v;s.reviewNext=w;switchPage('reward');break}
case'dice':s.drawn=Math.floor(Math.random()*6);s.diceCount++;s.rewardChoice=REWARDS[s.drawn][1];render();break;
case'finish':{const v=el('rewardChoice').value.trim();if(!v){alert('請寫下最後決定給自己的獎勵。');return}s.rewardChoice=v;s.completedAt=new Date().toISOString();finalizeArchive();switchPage('report');break}
case'export':exportText(s.page==='historyReport'?(s.archive[viewedHistory]||s):s);break;
case'print':window.print();break;
case'new':switchPage('home');break;
case'history':s.previousPage=s.page;switchPage('history');break;
case'backHistory':switchPage(s.previousPage||'home');break;
case'viewHistory':{const idx=Number(button.dataset.index);if(!s.archive[idx])return;viewedHistory=idx;switchPage('historyReport');break}
}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-mood],[data-pet],[data-state],[data-skill],[data-task]');if(!t)return;if(t.dataset.mood){s.name=el('nick')?.value||s.name;s.mood=t.dataset.mood;render();return}if(t.dataset.pet){s.name=el('nick')?.value||s.name;s.pet=t.dataset.pet;render();return}if(t.dataset.state){s.state=t.dataset.state;render();return}if(t.dataset.skill){s.skill=t.dataset.skill;render();return}if(t.dataset.task!==undefined){s.task=Number(t.dataset.task);s.goal='';render();return}if(t.dataset.act)act(t.dataset.act,t)});
document.addEventListener('input',e=>{if(e.target.id==='nick'){s.name=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.dataset.micro!==undefined){s.micro=s.micro||[false,false,false];s.micro[Number(e.target.dataset.micro)]=e.target.checked;save()}});
window.addEventListener('beforeunload',()=>{timerStepCore();save()});render();
</script></body></html>
