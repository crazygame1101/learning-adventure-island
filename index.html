];

const statusOptions=[

{id:'focus',icon:'📱',title:'讀一下就想滑手機',desc:'注意力很容易跑掉',recommend:['focus','start']},
{id:'read',icon:'📖',title:'有讀，但抓不到重點',desc:'不知道怎麼理解內容',recommend:['read','memory']},
{id:'solve',icon:'🧩',title:'遇到難題就想放棄',desc:'不知道卡在哪裡',recommend:['solve','growth']},
{id:'memory',icon:'💭',title:'看過很快就忘記',desc:'背了還是記不住',recommend:['memory','read']},

{id:'boost',icon:'🚀',title:'加速探索券',desc:'下一次擲骰時，額外前進 1 格。'},
{id:'title',icon:'🏆',title:'探索家稱號券',desc:'收藏專屬稱號「勇敢的學習探索家」，展示在成果頁。'}
];
function blank(){return {mode:null,stage:'status',status:null,island:null,task:null,round:0,score:0,pos:0,visited:[],logs:[],badges:[],claimedRewards:[],diceBoost:0,specialTitle:false,event:null,reflection:{done:'',strategy:'',next:''},confidence:3,doneState:'',teacherCount:3,teacherRounds:3,teacherPhase:'select',teacherNotes:'',history:[],finalReflection:{achievement:'',strategy:'',next:''}}}
let s=blank();try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.mode==='student'){s={...blank(),...v};if(!['status','choose','task','work','reflect','reward','finish'].includes(s.stage))s.stage='status';if(!Array.isArray(s.claimedRewards))s.claimedRewards=[];}}catch(e){}

const app=document.getElementById('app');

const I=()=>islands.find(x=>x.id===s.island)||islands[0];const T=()=>I().missions[s.task||0];
function save(){if(s.mode==='student'){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}}

function header(title,subtitle=''){return `<div class="eyebrow">${s.mode==='teacher'?'教師課堂模式':'學生自主模式'}</div><h1>${title}</h1>${subtitle?`<p class="muted">${subtitle}</p>`:''}`}
function steps(){const a=['選狀態','選島嶼','選任務','計時挑戰','反思一題','XP・探索'];let idx={status:0,choose:1,task:2,work:3,reflect:4,reward:5,finish:5}[s.stage]||0;return `<nav class="steps" aria-label="遊戲流程">${a.map((t,i)=>`<span class="step ${i===idx?'on':i<idx?'past':''}">${i+1}. ${t}</span>`).join('')}</nav>`}

function rewardCenter(){const available=Math.max(0,Math.floor(s.badges.length/2)-s.claimedRewards.length);return `<div class="notice blue" style="margin-top:16px"><h3>🎁 徽章集點獎勵</h3><p>每取得 <b>2 種不同島嶼徽章</b>，就能兌換一張學習冒險獎勵券。重複挑戰同一座島可以累積 XP，但不會重複算入徽章種類。</p><p><b>目前：${s.badges.length} 種徽章｜已領取 ${s.claimedRewards.length} 張｜可領取 ${available} 張</b></p>${available>0?`<div class="taskgrid">${rewardOptions.map(x=>`<button class="task" data-badge-reward="${x.id}"><strong>${x.icon} ${x.title}</strong><div class="detail">${x.desc}</div><div class="chip" style="margin-top:9px">領取這個獎勵</div></button>`).join('')}</div>`:'<p class="small muted">再探索不同能力島，就有機會領取下一個獎勵。</p>'}${s.claimedRewards.length?`<p class="small"><b>已領取：</b>${s.claimedRewards.map(x=>esc(x.title)).join('、')}</p>`:''}</div>`}

function timerBlock(){return `<div class="timer" id="clock">${timeFmt(secs)}</div><div class="center flex" style="justify-content:center">${btn(timerRunning?'⏸ 暫停':'▶ 開始計時','timerToggle','btn')} ${btn('↻ 重設','timerReset','btn alt')}</div><p class="muted center small" style="margin-top:12px">計時只是協助練習，不必在時間到之前答對所有題目。</p>`}

function setTimer(n){stopTimer();secs=n;updateClock()}function stopTimer(){clearInterval(timerId);timerId=null;timerRunning=false}function updateClock(){const el=document.getElementById('clock');if(el)el.textContent=timeFmt(secs)}
function timerToggle(){if(timerRunning){stopTimer();render();return;}if(secs<=0){toast('時間到！可以完成目前任務或繼續練習');return;}timerRunning=true;render();timerId=setInterval(()=>{secs--;updateClock();if(secs<=0){stopTimer();render();toast('挑戰時間到了，請檢視你的嘗試與成果！')}},1000)}
function renderHome(){return `<section class="hero"><div><div class="eyebrow">六座能力島・學習策略冒險</div><h1>今天，你想突破哪一種學習困難？</h1><p>選一座島、完成一個小任務、想想用了什麼方法。<br>每一小步，都是你自己的學習進度。</p><span class="tag">收集 2 種島嶼徽章，獲得專屬學習獎勵</span></div><div class="hero-illustration" aria-hidden="true">🏝️🎲</div></section><section class="panel"><h2>選擇你的玩法</h2><div class="mode-grid"><button class="mode" data-act="studentMode"><span class="emoji">🧑‍🚀</span><strong>我自己玩｜學生模式</strong><span class="muted small">選狀態 → 推薦島嶼 → 任務 → 一題反思 → XP → 探索。</span></button><button class="mode" data-act="teacherMode"><span class="emoji">👩‍🏫</span><strong>老師帶大家玩｜課堂模式</strong><span class="muted small">投影共用任務、統一計時、引導全班討論，不需學生登入。</span></button></div></section><section class="panel"><h2>🗺️ 六座能力島</h2>${islandGrid(false)}<p class="muted small" style="margin-top:12px">島嶼展示可點擊查看簡介；正式闖關請先選上面的遊戲模式。</p></section>`}
function student(){
if(s.stage==='finish')return finishPage();
if(s.stage==='status')return `<section class="panel">${header('今天的你，是哪一種學習狀態？','沒有正確答案，選一個最接近現在自己的感覺。每回合都可以重新選。')}${dashboard()}${steps()}${statusGrid()}<div class="notice" style="margin-top:16px">💡 冒險目標：完成 3 回合學習挑戰，收集不同能力島徽章，找出一個對自己有幫助的方法。</div></section>`;
if(s.stage==='choose'){const st=getStatus();return `<section class="panel">${header('依照你的狀態，推薦這兩座能力島',`你選擇：「${st.title}」。先從推薦島嶼開始，也可以自由探索其他島。`)}${dashboard()}${steps()}<h2>🌟 優先推薦</h2><div class="mode-grid">${st.recommend.map(id=>{const x=islands.find(k=>k.id===id);return `<button class="island" data-island="${x.id}"><span class="emoji">${x.emoji}</span><strong>${x.name}</strong><div class="detail">${x.issue}</div><div class="small">練習：${x.skill}</div></button>`}).join('')}</div><details style="margin-top:16px"><summary>想看看全部六座能力島？</summary>${islandGrid()}</details><div class="actionbar">${btn('← 重新選擇狀態','toStatus','btn alt')}</div></section>`}
if(s.stage==='task')return `<section class="panel">${header(`${I().emoji} ${I().name}｜選擇一張微目標卡`,I().hint)}${dashboard()}${steps()}<div class="taskgrid">${I().missions.map((t,i)=>`<button class="task" data-task="${i}" aria-pressed="${s.task===i}"><strong>${t[0]}</strong><div class="detail">${t[1]}</div><div class="meta"><span class="chip">⏱ ${t[2]} 分鐘</span><span class="chip">✨ +${t[3]} XP</span></div></button>`).join('')}</div><div class="actionbar">${btn('← 重新選島','toChoose','btn alt')}${btn('開始計時挑戰 →','startTask','btn')}</div></section>`;
if(s.stage==='work')return `<section class="panel">${header('開始計時挑戰！','準備好課本或習作，跟著自己的步調完成微目標。')}${dashboard()}${steps()}<div class="box"><span class="tag">${I().emoji} ${I().name}</span><h2 style="margin-top:8px">${T()[0]}</h2><p class="prompt">${T()[1]}</p></div>${timerBlock()}<div class="actionbar">${btn('← 重新選任務','backTask','btn alt')}${btn('我已認真嘗試，來反思 →','toReflect','btn')}</div></section>`;
if(s.stage==='reflect')return `<section class="panel">${header('反思 1 題，就能領取 XP！','只要寫下一個具體的發現，不需要長篇心得。')}${dashboard()}${steps()}<div class="box"><b>${T()[0]}</b><p class="muted small">${T()[1]}</p></div><label class="field">🌱 剛才你做到了什麼？或遇到什麼困難、想試什麼方法？<textarea id="doneInput" maxlength="240" placeholder="例：我先完成了第一題，第二題不會，但我把不懂的地方圈起來。">${esc(s.reflection.done)}</textarea></label><p class="small muted">只需回答這一題；不會的題目也能寫下努力過的步驟。</p><div class="actionbar">${btn('← 返回挑戰','backWork','btn alt')}${btn('提交反思・領取 XP →','claim','btn')}</div></section>`;
if(s.stage==='reward')return `<section class="panel">${header('✨ XP 到手！你的島嶼冒險又前進一步','徽章會在第一次完成某座島的任務與反思時解鎖。')}${dashboard()}${steps()}<div class="notice blue"><h2>🏅 ${esc(s.doneState||'完成一小步！')}</h2><p>完成「${I().name}」挑戰，獲得 <b>+${T()[3]} XP</b>。${s.badges.filter(x=>x===s.island).length?'這座島嶼的徽章已加入收藏！':''}</p></div><h3 style="margin-top:16px">我的能力島徽章</h3>${badges()}${rewardCenter()}<h3 style="margin-top:19px">🎲 擲骰探索事件</h3>${mapView()}${s.event?`<div class="box"><h3>${s.event.icon} ${s.event.title}</h3><p>${s.event.text}</p><p class="small muted">${s.event.tip}</p></div>`:'<p class="muted">擲出 1～3 點，看看你遇到什麼冒險事件。擲骰只影響探索，不影響你已取得的 XP。</p>'}<div class="actionbar">${s.event?btn(s.round>=3?'查看三回合成果 →':'開始下一回合 →','nextRound','btn'):btn('🎲 擲骰前進','dice','btn')}</div></section>`;
}
function badges(){return `<div class="badge-list">${islands.map(x=>`<span class="badgeitem ${s.badges.includes(x.id)?'earned':''}">${s.badges.includes(x.id)?'✓':'🔒'} ${x.emoji}${x.name}</span>`).join('')}</div>`}
function finishPage(){const fr=s.finalReflection||{achievement:'',strategy:'',next:''};return `<section class="panel">${header('🎉 冒險完成！來回答最後 3 題','完成三次學習挑戰後，花一點時間整理今天的發現。這裡沒有標準答案。')}${dashboard()}${s.specialTitle?'<p class="notice">🏆 專屬稱號：勇敢的學習探索家</p>':''}<h3 style="margin-top:20px">你練習過的學習島嶼</h3>${badges()}${rewardCenter()}<h3 style="margin-top:20px">今天的任務紀錄</h3>${s.logs.map((l,i)=>`<div class="box" style="margin:9px 0"><b>第 ${i+1} 回合｜${esc(l.island)}｜${esc(l.title)}</b><div class="small">嘗試：${esc(l.done)}</div></div>`).join('')}<hr class="hr"><h2>🌱 我的三題學習總反思</h2><p class="muted small">每題寫一、兩句就好。請依照自己的真實經驗回答。</p><label class="field">① 這三回合中，我完成了什麼原本覺得有點困難的事？<textarea id="finalAchievement" maxlength="400" placeholder="例如：我本來不想動筆，但最後完成了兩題數學題目。">${esc(fr.achievement)}</textarea></label><label class="field">② 今天哪一種學習方法最有幫助？為什麼？<textarea id="finalStrategy" maxlength="400" placeholder="例如：先把作業拆成小目標，讓我比較容易開始。">${esc(fr.strategy)}</textarea></label><label class="field">③ 下次讀書時，如果再遇到困難，我想怎麼做？<textarea id="finalNext" maxlength="400" placeholder="例如：我會先做五分鐘，卡住時把問題圈起來再求助。">${esc(fr.next)}</textarea></label><div class="actionbar">${btn('📥 儲存並下載三題反思紀錄','exportStudent','btn alt')}${btn('再展開新冒險','restartStudent','btn')}</div><p class="small muted" style="margin-top:12px">三題會保留在目前瀏覽器，也可下載成文字檔自行保存；不會自動上傳給老師。</p></section>`}
function captureFinalReflection(){const ids=[['finalAchievement','achievement'],['finalStrategy','strategy'],['finalNext','next']];s.finalReflection=s.finalReflection||{achievement:'',strategy:'',next:''};for(const [id,key] of ids){const el=document.getElementById(id);if(el)s.finalReflection[key]=el.value.trim();}save();}

function teacher(){let isl=I();let task=isl.missions[s.task||0];if(s.teacherPhase==='select')return `<section class="panel">${header('課堂冒險設定','老師使用一台裝置操作並投影；學生在自己的課本或學習單上完成任務。')}${dashboard()}<div class="two"><label class="field">小隊數（僅作課堂安排）<select id="countSelect"><option value="2" ${s.teacherCount===2?'selected':''}>2 隊</option><option value="3" ${s.teacherCount===3?'selected':''}>3 隊</option><option value="4" ${s.teacherCount===4?'selected':''}>4 隊</option><option value="5" ${s.teacherCount===5?'selected':''}>5 隊</option><option value="6" ${s.teacherCount===6?'selected':''}>6 隊</option></select></label><label class="field">預計回合數<select id="roundSelect"><option value="2" ${s.teacherRounds===2?'selected':''}>2 回合（短活動）</option><option value="3" ${s.teacherRounds===3?'selected':''}>3 回合（推薦）</option><option value="4" ${s.teacherRounds===4?'selected':''}>4 回合（進階）</option></select></label></div><h2>本回合要練習哪一種策略？</h2>${islandGrid()}<p class="notice" style="margin-top:15px">課堂模式採「全班共用一個學習目標、各自完成任務」，不比較個人成績。老師可依程度讓學生完成任務中的部分步驟。</p><div class="actionbar">${btn('開始設定任務 →','teacherTask','btn')}</div></section>`;
if(s.teacherPhase==='task')return `<section class="panel">${header(`${isl.emoji} ${isl.name}｜老師選擇挑戰任務`,'選一張適合目前教材的任務卡。')}${dashboard()}<div class="taskgrid">${isl.missions.map((t,i)=>`<button class="task" data-task="${i}" aria-pressed="${s.task===i}"><strong>${t[0]}</strong><div class="detail">${t[1]}</div><div class="meta"><span class="chip">⏱ ${t[2]} 分鐘</span><span class="chip">✨ +${t[3]} XP</span></div></button>`).join('')}</div><div class="actionbar">${btn('← 換島','teacherBack','btn alt')}${btn('進入全班挑戰畫面 →','teacherStart','btn')}</div></section>`;
if(s.teacherPhase==='work')return `<section class="panel">${header(`第 ${s.round+1} / ${s.teacherRounds} 回合｜全班一起挑戰`,'老師負責投影與計時，學生在自己的教材上實際練習。')}<div class="teacher-grid"><div><div class="box"><span class="tag">${isl.emoji} ${isl.name}</span><h1 style="margin-top:12px">${esc(task[0])}</h1><p class="prompt">${esc(task[1])}</p></div>${timerBlock()}</div><aside class="box"><h3>👩‍🏫 教師引導提示</h3><p><b>預視：</b>你打算先完成哪一步？</p><p><b>表現：</b>現在用了哪一種方法？</p><p><b>反思：</b>哪一步最順利？遇到困難時怎麼處理？</p><p class="muted small">完成不等於全部答對；可引導學生指出已完成的部分與卡點。</p></aside></div><div class="actionbar">${btn('← 返回選卡','teacherWorkBack','btn alt')}${btn('結束挑戰・進入討論 →','teacherReflect','btn')}</div></section>`;
if(s.teacherPhase==='reflect')return `<section class="panel">${header('全班反思時間','帶領學生說出自己的學習方法，而不只是宣布答對幾題。')}<div class="notice blue"><h2>${isl.emoji} ${esc(task[0])}</h2><p>請邀請 2～3 位同學分享（可自願回答）：</p><ol class="help-list"><li>剛才你完成了什麼？</li><li>遇到困難時，你怎麼做？</li><li>下一次你想試哪一種方法？</li></ol></div><label class="field">教師匿名觀察紀錄（選填）<textarea id="teacherNotes" placeholder="例：部分同學不知道怎麼把任務拆小；下次可提供範例">${esc(s.teacherNotes)}</textarea></label><div class="actionbar">${btn('← 回到任務','teacherReflectBack','btn alt')}${btn('完成本回合・領取成就 →','teacherReward','btn')}</div></section>`;
if(s.teacherPhase==='reward')return `<section class="panel">${header('全班成功解鎖一項學習策略！','成就屬於全班共同的練習歷程，不進行學生排名。')}${dashboard()}${badges()}${mapView()}${s.event?`<div class="box"><h3>${s.event.icon} ${s.event.title}</h3><p>${s.event.text}</p><p class="muted small">${s.event.tip}</p></div>`:'<p class="muted">擲骰決定本回合探索的事件。</p>'}<div class="actionbar">${s.event?btn(s.round>=s.teacherRounds?'查看課堂成果 →':'開始下一回合 →','teacherNext','btn'):btn('🎲 全班擲骰前進','teacherDice','btn')}</div></section>`;
if(s.teacherPhase==='finish')return `<section class="panel">${header('🏆 課堂冒險完成！','全班一起回顧今天練習的策略。')}${dashboard()}${badges()}<div class="notice blue" style="margin-top:20px"><b>結束提問</b><ol><li>哪一種方法最適合你？</li><li>回家後願意先試哪一個小任務？</li><li>如果明天卡關，你有什麼其他辦法？</li></ol></div><h3 style="margin-top:20px">本次帶領紀錄</h3>${s.history.map((h,i)=>`<div class="box" style="margin:8px 0"><b>第${i+1}回合：${esc(h.island)}／${esc(h.title)}</b><p class="small">${esc(h.notes||'未填寫觀察')}</p></div>`).join('')}<div class="actionbar">${btn('下載匿名帶領紀錄','exportTeacher','btn alt')}${btn('開始新的一堂課','restartTeacher','btn')}</div></section>`;
}
function render(){app.innerHTML=s.mode==='student'?student():s.mode==='teacher'?teacher():renderHome();save()}
function moveTo(island){s.island=island;s.task=0;if(s.mode==='student')s.stage='task';render();window.scrollTo({top:0,behavior:'smooth'})}
function download(name,content){const b=new Blob(['\ufeff',content],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function rememberInput(id,key){const el=document.getElementById(id);if(el)s.reflection[key]=el.value.trim()}
function doAct(a){switch(a){case 'studentMode':if(s.mode!=='student'){s=blank();s.mode='student';}render();break;case 'teacherMode':s=blank();s.mode='teacher';render();break;case 'toChoose':s.stage='choose';render();break;case 'toStatus':s.stage='status';render();break;case 'startTask':s.stage='work';setTimer(T()[2]*60);render();break;case 'backTask':stopTimer();s.stage='task';render();break;case 'timerToggle':timerToggle();break;case 'timerReset':setTimer(T()[2]*60);render();break;case 'toReflect':stopTimer();s.stage='reflect';render();break;case 'backWork':s.stage='work';render();break;case 'claim':rememberInput('doneInput','done');if(!s.reflection.done){toast('先寫下一句反思，再領取 XP');return;}s.score+=T()[3];s.logs.push({island:I().name,title:T()[0],...s.reflection});if(!s.badges.includes(s.island))s.badges.push(s.island);s.round++;s.doneState=T()[0];s.stage='reward';s.event=null;render();break;case 'dice':{let d=Math.floor(Math.random()*3)+1;const advance=d+(s.diceBoost||0);s.pos=Math.min(board.length-1,s.pos+advance);s.diceBoost=0;s.visited.push(s.pos);s.event=events[Math.floor(Math.random()*events.length)];render();toast(`🎲 擲出 ${d} 點，前進 ${advance} 格`);break;}case 'nextRound':s.reflection={done:'',strategy:'',next:''};s.stage=s.round>=3?'finish':'status';s.island=null;s.task=null;s.event=null;render();break;case 'exportStudent':{captureFinalReflection();const f=s.finalReflection;download('學習冒險島_我的學習紀錄.txt',`學習冒險島｜我的學習紀錄\n總XP：${s.score}\n\n`+s.logs.map((l,i)=>`第${i+1}回合｜${l.island}：${l.title}\n嘗試：${l.done}`).join('\n\n')+`\n\n【三回合總反思】\n1. 我完成了什麼原本覺得困難的事？\n${f.achievement||'尚未填寫'}\n\n2. 哪一種學習方法最有幫助？為什麼？\n${f.strategy||'尚未填寫'}\n\n3. 下次遇到困難，我想怎麼做？\n${f.next||'尚未填寫'}`);break;}case 'restartStudent':{const v=confirm('確定重新開始？目前進度會重設，建議先下載學習紀錄。');if(!v)return;s=blank();s.mode='student';render();break;}case 'teacherTask':s.teacherCount=Number(document.getElementById('countSelect')?.value||3);s.teacherRounds=Number(document.getElementById('roundSelect')?.value||3);s.teacherPhase='task';render();break;case 'teacherBack':s.teacherPhase='select';render();break;case 'teacherStart':s.teacherPhase='work';setTimer(T()[2]*60);render();break;case 'teacherWorkBack':stopTimer();s.teacherPhase='task';render();break;case 'teacherReflect':stopTimer();s.teacherPhase='reflect';render();break;case 'teacherReflectBack':s.teacherPhase='work';render();break;case 'teacherReward':s.teacherNotes=document.getElementById('teacherNotes')?.value.trim()||'';s.history.push({island:I().name,title:T()[0],notes:s.teacherNotes});s.teacherNotes='';s.score+=T()[3];if(!s.badges.includes(s.island))s.badges.push(s.island);s.round++;s.event=null;s.teacherPhase='reward';render();break;case 'teacherDice':{let d=Math.floor(Math.random()*3)+1;s.pos=Math.min(board.length-1,s.pos+d);s.visited.push(s.pos);s.event=events[Math.floor(Math.random()*events.length)];render();toast(`全班擲出 ${d} 點！`);break;}case 'teacherNext':s.teacherPhase=s.round>=s.teacherRounds?'finish':'select';s.event=null;render();break;case 'exportTeacher':download('學習冒險島_匿名帶領紀錄.txt',`學習冒險島｜課堂帶領紀錄\n小隊數：${s.teacherCount}\n回合：${s.round}\n`+s.history.map((h,i)=>`\n第${i+1}回合｜${h.island}｜${h.title}\n觀察：${h.notes||'未填寫'}`).join('\n'));break;case 'restartTeacher':s=blank();s.mode='teacher';render();break;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-status],[data-badge-reward],[data-island],[data-task]');if(!b)return;if(b.dataset.status){s.status=b.dataset.status;s.stage='choose';render();window.scrollTo({top:0,behavior:'smooth'});return;}if(b.dataset.badgeReward){const available=Math.floor(s.badges.length/2)-s.claimedRewards.length;if(available<=0){toast('還需要收集不同島嶼徽章！');return;}const choice=rewardOptions.find(x=>x.id===b.dataset.badgeReward);if(choice){s.claimedRewards.push({id:choice.id,title:choice.title,desc:choice.desc});if(choice.id==='bonus')s.score+=2;if(choice.id==='boost')s.diceBoost=(s.diceBoost||0)+1;if(choice.id==='title')s.specialTitle=true;render();toast('🎁 已領取：'+choice.title)}return;}if(b.dataset.island){if(!s.mode){toast('先選學生模式或教師模式，再開始闖關！');return;}if(s.mode==='student'){moveTo(b.dataset.island);}else{s.island=b.dataset.island;s.task=0;render();}return;}if(b.dataset.task!==undefined){s.task=Number(b.dataset.task);render();return;}if(b.dataset.act)doAct(b.dataset.act)});
document.getElementById('homeBtn').onclick=()=>{stopTimer();if(s.mode==='student'&&s.round>0&&s.stage!=='finish'){if(!confirm('回到模式首頁？個人進度會保留，下次可繼續。'))return;}s.mode=null;render()};
document.addEventListener('input',e=>{if(s.mode==='student'&&s.stage==='finish'&&['finalAchievement','finalStrategy','finalNext'].includes(e.target.id))captureFinalReflection()});
document.getElementById('helpBtn').onclick=()=>{const old=document.getElementById('helpOverlay');if(old){old.remove();return;}const d=document.createElement('div');d.id='helpOverlay';d.style.cssText='position:fixed;inset:0;background:#103c3dbb;z-index:40;overflow:auto;padding:22px;display:grid;place-items:center';d.innerHTML=`<div class="panel" style="width:min(650px,100%);margin:auto"><div class="flex" style="justify-content:space-between"><h2>❔ 怎麼玩學習冒險島？</h2><button class="btn alt mini" id="closeHelp">關閉 ✕</button></div><p>遊戲的目標不是衝最高分，而是找到適合自己的學習策略。</p><ol class="help-list"><li><b>選狀態：</b>選擇自己現在最像哪一種學習狀態，系統會推薦能力島。</li><li><b>選島嶼：</b>從推薦的能力島選一座，也可以自行探索六座島。</li><li><b>選任務：</b>挑一張能完成的小任務卡。</li><li><b>做任務：</b>用課本、習作或學習單實際練習；計時器只是輔助。</li><li><b>反思：</b>只要回答一題，寫下今天的嘗試、困難或調整。</li><li><b>領 XP、擲骰：</b>完成任務與反思後獲得 XP 和該島徽章，再擲骰探索事件。收集 2 種不同徽章可選擇一張學習獎勵券。</li><li><b>完成：</b>學生三回合後回答 3 題總反思，整理成果、有效策略與下一次的調整。教師可以統一投影帶領全班。</li></ol><div class="notice">💡 若題目不會，能指出自己卡在哪裡並完成任務卡要求的嘗試，也算有學習進展。</div></div>`;document.body.appendChild(d);d.querySelector('#closeHelp').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()}};
render();
</script></body></html>
